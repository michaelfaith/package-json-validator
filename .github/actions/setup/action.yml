name: Setup

description: Sets up the repo for a typical CI job

inputs:
  cache:
    description: Cache the pnpm store
    default: true
    required: false
  install-flags:
    description: Flags to pass to `pnpm install`
    required: false
    type: string
  node-version:
    description: Node.js version to use
    default: '24'
    required: false

runs:
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: ${{ inputs.cache }}
        install: ${{ inputs.install-flags == '' }}
        runtime: node@${{ inputs.node-version }}

    - run: pnpm install $INSTALL_FLAGS
      if: ${{ inputs.install-flags != '' }}
      env:
        INSTALL_FLAGS: ${{ inputs.install-flags }}
      shell: bash
  using: composite
